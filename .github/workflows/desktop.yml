# FishDock for Windows: builds the installer (FishDock-Setup-<version>.exe) on a Windows machine and publishes it as a
# GitHub release. Runs when a tag like desktop-v0.1.0 is pushed, or by hand from the Actions tab. The game inside is
# the live website, so the installer only needs rebuilding when the launcher itself changes.
name: Desktop installer
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - uses: actions/upload-artifact@v4
        with:
          name: FishDock-Setup
          path: desktop/out/FishDock-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FishDock for Windows ${{ github.ref_name }}
          files: desktop/out/FishDock-Setup-*.exe
          body: |
            FishDock for Windows. Download FishDock-Setup and run it. Windows SmartScreen may warn that the app is unsigned: choose "More info", then "Run anyway".
            The launcher opens the live game full screen on your graphics card. Needs the internet.
