# FishDock for Windows: builds the installer (FishDock-Setup-<version>.exe) on a Windows machine and publishes it as a
# GitHub release. Runs when a tag like desktop-v0.1.0 is pushed, or by hand from the Actions tab. The game inside is
# the live website, so the installer only needs rebuilding when the launcher itself changes.
name: Desktop installer
on:
  push:
    tags: ["desktop-v*"]
    branches: ["desktop-*"] # (a test build of the installer for any launcher branch: an artifact, no release)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # exactly the pinned dependencies (desktop/package-lock.json, written by the "Desktop lockfile" workflow)
      - run: npm ci --ignore-scripts=false --no-audit --no-fund
        working-directory: desktop
      - name: What went in
        working-directory: desktop
        run: |
          echo "commit:           ${{ github.sha }}"
          echo "electron:         $(node -p "require('electron/package.json').version")"
          echo "electron-builder: $(node -p "require('electron-builder/package.json').version")"
        shell: bash
      - run: npm run dist
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }
      - name: Checksum
        shell: pwsh
        run: |
          Get-ChildItem desktop/out/FishDock-Setup-*.exe | ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length; (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Tee-Object -FilePath desktop/out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FishDock-Setup
          path: |
            desktop/out/FishDock-Setup-*.exe
            desktop/out/SHA256SUMS.txt
      - name: Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FishDock for Windows ${{ github.ref_name }}
          files: |
            desktop/out/FishDock-Setup-*.exe
            desktop/out/SHA256SUMS.txt
          body: |
            FishDock for Windows. Download FishDock-Setup and run it. Windows SmartScreen may warn that the app is unsigned: choose "More info", then "Run anyway".
            The launcher opens the live game full screen on your graphics card. Needs the internet.
