# Temporary: the mobile audit of the fix-pass branch, run in workerd (wrangler dev) before it is deployed.
name: Live party check
on:
  push:
    branches: [live-check]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start wrangler dev
        run: |
          npx --yes wrangler@4 dev --port 8787 --ip 127.0.0.1 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -H 'x-fishdock: 1' http://127.0.0.1:8787/api/health > /dev/null && break; sleep 2; done
      - run: node tools/mobile-audit.mjs http://127.0.0.1:8787
        continue-on-error: true
      - name: Save the screenshots to the audit-local branch
        run: |
          tail -30 wrangler.log
          cd audit && git init -q -b audit-local && git add -A
          git -c user.name=audit -c user.email=audit@localhost commit -qm "mobile audit (fix-pass in workerd) $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit-local
