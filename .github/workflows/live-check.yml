# Temporary: the mobile audit of the live site, in phone-sized Chromium. Screenshots go to the audit-shots branch.
name: Live party check
on:
  push:
    branches: [live-check]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node tools/mobile-audit.mjs https://fishdock.aaron6k.workers.dev
        continue-on-error: true
      - name: Save the screenshots to the audit-shots branch
        run: |
          cd audit && git init -q -b audit-shots && git add -A
          git -c user.name=audit -c user.email=audit@localhost commit -qm "mobile audit $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit-shots
