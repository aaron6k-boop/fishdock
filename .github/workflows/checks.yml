# Checks (as DetectDock's): unit and server tests, the data check and the production build, on every pull request
# and every push to main. Nothing here deploys; Cloudflare Pages builds and deploys on its own.
name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    name: Unit tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test tests/*.test.js
      - run: node tools/check-data.mjs
      - run: npm run build
